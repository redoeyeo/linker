[project]
name = "linker"
version = "0.1.0"
description = "Aggregate information everywhere"
authors = [{ name = "Nikita Grigorenko" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest (>=8.4.2,<9.0.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "alembic (>=1.17.1,<2.0.0)",
    "scrapy (>=2.13.3,<3.0.0)",
    "lxml (==6.0.2)",
    "ipython (>=9.7.0,<10.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "django (>=5.2.8,<6.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "django-stubs[compatible-mypy] (>=5.2.8,<6.0.0)",
    "audioop-lts (>=0.2.2,<0.3.0)",
    "sounddevice (>=0.5.3,<0.6.0)",
    "numpy (>=2.3.5,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "ipykernel (>=7.1.0,<8.0.0)",
    "pytest-django (>=4.11.1,<5.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "collector.settings"
