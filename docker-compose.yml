services:
  postgres:
    image: postgres:latest
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5430:5432"  # Порт 5432 внутри контейнера пробрасывается на порт 5430 хоста
    volumes:
      - ./postgresql:/var/lib/postgresql/  # Монтирование локального каталога для сохранения данных
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      postgres
      -c max_connections=1000
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.7
      -c wal_buffers=16MB
      -c default_statistics_target=100
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U '${POSTGRES_USER}' -d '${POSTGRES_DB}'" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true
  audio_transcription_prod:
    container_name: audio_transcription_prod
    build:
      context: ./services/audio_transcription
      dockerfile: Dockerfile
    environment:
      VOSK_MODEL_NAME: vosk-model-small-ru-0.22
    ports:
      - "8300:8000"
    volumes:
      - ./services/audio_transcription/models/:/app/models:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 8192M
        reservations:
          cpus: '0.5'
          memory: 4096M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
    driver: local


