<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С любовью к Марине</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f9f0ff, #e6f7ff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #e91e63;
            margin-bottom: 20px;
        }
        .message {
            font-size: 24px;
            color: #333;
            margin: 30px 0;
            line-height: 1.6;
        }
        .heart-gif {
            width: 100px;
            height: 100px;
            margin: 20px auto;
            display: block;
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #1976d2;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Моя любимая Марина ❤️</h1>
        <img src="/static/images/heart.gif" alt="Крутящееся сердечко" class="heart-gif">
        <div class="message">
            {{ message }}
        </div>
    </div>
</body>
</html>
